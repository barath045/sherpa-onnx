
name: JARVIS English KWS APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-kws-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: jarvis-android

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip jinja2

      - name: Check Android build tools
        shell: bash
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          ls -lh "$ANDROID_NDK_LATEST_HOME"
          ls -lh "$ANDROID_HOME/build-tools"

      - name: Prepare build script
        shell: bash
        run: |
          set -e
          mv scripts/apk/build-apk-kws.sh ./build-apk-kws.sh
          test -f ./build-apk-kws.sh

      - name: Build Android APKs
        shell: bash
        run: |
          set -e
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:$PATH"
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"

          cmake --version
          ./build-apk-kws.sh

      - name: Sign English ARM64 APK
        shell: bash
        run: |
          set -e

          APK=$(find apks -maxdepth 1 -type f \
            -name '*arm64-v8a-kws-en-gigaspeech-zipformer.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "English ARM64 APK was not generated"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          APK_SIGNER="$BUILD_TOOLS_DIR/apksigner"

          PASS=$(openssl rand -hex 16)

          keytool -genkeypair \
            -keystore jarvis-test.jks \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias jarvis \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=JARVIS Test,O=Local,C=IN"

          "$APK_SIGNER" sign \
            --ks jarvis-test.jks \
            --ks-key-alias jarvis \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --out JARVIS-KWS-arm64-v8a.apk \
            "$APK"

          "$APK_SIGNER" verify JARVIS-KWS-arm64-v8a.apk

          rm -f jarvis-test.jks

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-English-KWS-APK
          path: JARVIS-KWS-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7
